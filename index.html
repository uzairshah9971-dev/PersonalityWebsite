<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality App Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>🎭 Personality App Pro</h1>

    <p class="subtitle">
        Discover your fun personality!
    </p>

    <input
        type="text"
        id="name"
        placeholder="👤 Enter your name">

    <input
        type="number"
        id="number"
        min="1"
        max="99"
        placeholder="🔢 Enter a number (1-99)">

    <button onclick="showPersonality()">
        ✨ Show Personality
    </button>

    <button class="random" onclick="randomPersonality()">
        🎲 Random Number
    </button>

    <button class="clear" onclick="clearFields()">
        🗑 Clear
    </button>

    <div id="result">
        Your result will appear here 😊
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
